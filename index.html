    case 'tt-done': ui.ttEdit = null; renderSheet(); break;
    case 'db-next': ui.db.step = Math.min(3, ui.db.step + 1); renderSheet(); sheetEl.querySelector('.sheet-body').scrollTop = 0; break;
    case 'db-back': ui.db.step = Math.max(0, ui.db.step - 1); renderSheet(); break;
    case 'db-shuffle': { const rest = DB_POOL.map(p => p.id).filter(id => id !== 'energy' && !ui.db.qs.includes(id)).sort(() => Math.random() - .5); ui.db.qs = ['energy', ...rest.slice(0, 2)]; renderSheet(); break; }
    case 'db-share': ui.db.share = true; renderSheet(); break;
    case 'db-save': saveDebrief(); break;
    case 'hive-new': hiveNew(); break;
    case 'ignite': ignite(id); break;
    case 'relaunch': { const v = vec(id); v.landedAt = null; commit(); toast(`Relaunched · ${v.title}`); break; }
    case 'land': { const v = vec(id); if (state.active && state.active.vectorId === id) logActive(false); v.landedAt = Date.now(); commit(); toast(`Landed · ${v.title}`); break; }
    case 'clear-samples': {
      if (state.active && (vec(state.active.vectorId) || {}).sample) state.active = null;
      state.vectors = state.vectors.filter(v => !v.sample); state.orbits = state.orbits.filter(o => !o.sample); state.sessions = state.sessions.filter(s => !s.sample);
      Object.keys(state.debriefs).forEach(k => { if (state.debriefs[k].sample) delete state.debriefs[k]; });
      ui.hive.path = []; ui.hive.sel = 'c';
      commit(); toast('Examples cleared. Launch your first vector.'); break;
    }
    case 'sheet-close': closeSheet(); break;
    case 'sheet-back': sheetBack(); break;
    case 'del-ask': ui.confirm = id; renderSheet(); break;
    case 'del-no': ui.confirm = null; renderSheet(); break;
    case 'del-yes': { if (state.active && state.active.vectorId === id) logActive(false); state.vectors = state.vectors.filter(v => v.id !== id); ui.confirm = null; commit(); if (ui.sheetStack.length) sheetBack(); else closeSheet(); toast('Vector deleted'); break; }
    case 'week-prev': ui.weekOffset--; renderView(); break;
    case 'week-next': ui.weekOffset++; renderView(); break;
    case 'week-today': ui.weekOffset = 0; renderView(); break;
    case 'board-more': ui.boardMore = !ui.boardMore; renderView(); break;
    case 'at-burn': { const n = atNode(id); if (n) ignite(atVector(n).id); break; }
    case 'at-plan': { const n = atNode(id); if (n) openFlow({ title: atTitle(n), note: n.note || '', showNote: !!n.note, atlasId: n.id, fieldId: atField(n) }); break; }
    case 'at-did': { const n = atNode(id); if (n) { n.touched = Date.now(); delete n.starter; commit(); toast(`Logged · ${n.name}`); } break; }
    case 'at-del': ui.atDel = id; renderView(); break;
    case 'at-del-no': ui.atDel = null; renderView(); break;
    case 'at-del-yes': { const gone = new Set([id]); let more = true; while (more) { more = false; state.atlas.forEach(n => { if (gone.has(n.parent) && !gone.has(n.id)) { gone.add(n.id); more = true; } }); } const p = (atNode(id) || {}).parent || null; state.atlas = state.atlas.filter(n => !gone.has(n.id)); ui.atlas = p; ui.atDel = null; commit(); break; }
    case 'tt-paste': {
      const ta = $('#tt-paste'), bad = []; let added = 0;
      (ta ? ta.value : '').split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
        const m = l.match(/^([a-z]{3})[a-z]*\.?\s+(\d{1,2})[:.](\d{2})\s*[-–]\s*(\d{1,2})[:.](\d{2})\s+(.+)$/i), dow = m ? ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'].indexOf(m[1].toLowerCase()) + 1 : 0;
        if (!dow) { bad.push(l); return; }
        const s = pad(+m[2]) + ':' + m[3], e = pad(+m[4]) + ':' + m[5], t = m[6].trim();
        if (!state.classes.some(c => c.dow === dow && c.s === s && c.t === t)) { state.classes.push({ id: uid(), dow, s, e, t, short: t, k: /meeting/i.test(t) ? 'Meeting' : '', room: '', who: '' }); added++; }
      });
      commit(); toast(bad.length ? `Added ${added}. Could not read ${bad.length} line${bad.length > 1 ? 's' : ''}.` : `Added ${added}`);
      const t2 = $('#tt-paste'); if (t2) t2.value = bad.join('\n');
      break;
    }
    case 'sync-now': (async () => { setSync('connecting'); try { await gistPull(); await flushCloud(); setSync('ok'); toast('Synced'); } catch (e) { setSync('err'); toast('Could not reach GitHub.'); } renderSheet(); })(); break;
    case 'sync-off': setSyncCfg(null); cloud = null; setSync('local'); renderSheet(); toast('Sync is off on this device. Your data stays here.'); break;
    case 'data-copy': {
      const txt = JSON.stringify(state);
      const fallback = () => { const ta = $('#data-in'); if (ta) { ta.value = txt; ta.focus(); ta.select(); } toast('Selected. Press Ctrl+C (or Copy) to copy it.'); };
      try { navigator.clipboard.writeText(txt).then(() => toast(`Copied · ${Math.round(txt.length / 1024)} KB of KAIROS data`), fallback); } catch (e) { fallback(); }
      break;
    }
    case 'data-download': {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' }));
      a.download = `kairos-backup-${todayKey()}.json`; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      break;
    }
    case 'data-file': { const f = $('#data-file'); if (f) f.click(); break; }
    case 'data-import': { const txt = ($('#data-in') || {}).value || ''; if (!txt.trim()) { toast('Paste KAIROS data first.'); break; } if (!ui.impArm) { ui.impText = txt; ui.impArm = true; renderSheet(); } else { ui.impText = ''; importData(txt); } break; }
    case 'data-cancel': ui.impArm = false; ui.impText = ''; renderSheet(); break;
    case 'alerts-on': try { Notification.requestPermission().then(() => renderSheet()); } catch (e) {} break;
    case 'cal-unpin': ui.calPin = null; calShow(null, true); break;
    case 'cal-week': setCalMode('week'); break;
    case 'cal-month': setCalMode('month'); break;
    case 'cal-prev': ui.monthOffset--; renderView(); break;
    case 'cal-next': ui.monthOffset++; renderView(); break;
    // flow
    case 'flow-close': { const ret = ui.flowReturn; closeFlow(); if (ret) openSheet(ret.type, ret.id); break; }
    case 'flow-back': goStep(ui.step - 1); break;
    case 'flow-next': goStep(ui.step + 1); break;
    case 'flow-launch': launch(); break;
    case 'show-note': ui.draft.showNote = true; renderFlow(); { const n = $('#fl-note'); n && n.focus(); } break;
    case 'clear-time': ui.draft.anchorTime = ''; renderFlow(); break;
    // burn
    case 'burn-open': openBurn(); break;
    case 'burn-min': closeBurn(); break;
    case 'burn-pause': {
      const a = state.active; if (!a) break;
      if (a.paused) { a.startedAt = Date.now(); a.paused = false; delete a.pausedAt; wakeOn(); primeAudio(); }
      else { a.accMs = elapsedMs(a); a.paused = true; a.pausedAt = Date.now(); a.pauses = (a.pauses || 0) + 1; wakeOff(); }
      commit(); break;
    }
    case 'burn-end': { const min = logActive(false); closeBurn(); commit(); toast(min >= 1 ? `Logged ${fmtMin(min)}` : 'Under a minute, not logged'); break; }
    case 'burn-land': { const v = vec(state.active.vectorId); const min = logActive(true); closeBurn(); commit(); toast(`Landed · ${v.title}${min >= 1 ? ' · ' + fmtMin(min) : ''}`); break; }
  }
});

// text inputs inside the flow update the draft without re-rendering
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'db-screen' && ui.db) { ui.db.screen = +el.value; ui.db.appMin = Math.min(ui.db.appMin, ui.db.screen); $('#db-screen-v').textContent = fmtMin(ui.db.screen); const a = $('#db-app'); if (a) { a.max = ui.db.screen; a.value = ui.db.appMin; $('#db-app-v').textContent = fmtMin(ui.db.appMin); } return; }
  if (el.id === 'db-app' && ui.db) { ui.db.appMin = +el.value; $('#db-app-v').textContent = fmtMin(ui.db.appMin); return; }
  if (el.dataset && el.dataset.dbtext && ui.db) { ui.db.ans[el.dataset.dbtext] = el.value; return; }
  if (!ui.flowOpen || !flowEl.contains(el)) return;
  if (el.id === 'fl-title') ui.draft.title = el.value;
  else if (el.id === 'fl-note') ui.draft.note = el.value;
  else if (el.id === 'fl-stage-new') ui.draft.stageDraft = el.value;
  else if (el.dataset.stageIdx != null) ui.draft.stages[+el.dataset.stageIdx] = el.value;
});

// committed edits (sheet fields, date/time inputs, checkboxes)
// Time and date boxes report a "change" after the first digit (typing 1 of 17 already makes 01:00),
// and saving then redraws the box and eats the second digit. So they save when you leave the box or press Enter.
const isTyped = el => el.type === 'time' || el.type === 'date';
let ptrDown = false;
document.addEventListener('pointerdown', () => { ptrDown = true; }, true);
document.addEventListener('pointerup', () => { setTimeout(() => { ptrDown = false; }, 0); }, true);
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'fl-time') { ui.draft.anchorTime = el.value; return; } // kept in the draft only, nothing redraws
  if (isTyped(el) && document.activeElement === el) { el.dataset.pending = '1'; return; }
  fieldChanged(el);
});
document.addEventListener('focusout', e => {
  const el = e.target; if (!el.dataset || !el.dataset.pending) return;
  delete el.dataset.pending;
  const sh = ui.sheet && Object.assign({}, ui.sheet);
  if (!ptrDown) { fieldChanged(el, sh); return; }
  // you are clicking something else: let that click land first, then save (saving redraws the sheet)
  let done = false; const run = () => { if (!done) { done = true; fieldChanged(el, sh); } };
  document.addEventListener('click', () => setTimeout(run, 0), { once: true });
  setTimeout(run, 700);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && isTyped(e.target)) e.target.blur(); });
function fieldChanged(el, sh = ui.sheet) {
  if (el.id === 'at-name' || el.id === 'at-note' || el.id === 'at-remind') {
    const n = atNode(ui.atlas); if (!n) return;
    delete n.starter;
    if (el.id === 'at-name') { n.name = el.value.trim() || n.name; const c = $('#at-cur'); if (c) c.textContent = n.name; }
    else if (el.id === 'at-note') n.note = el.value;
    else { n.remind = +el.value; if (n.remind) n.remindFrom = Date.now(); }
    quietSave(); return;
  }
  if (el.id === 'data-file' && el.files && el.files[0]) { const r = new FileReader(); r.onload = () => { ui.impText = String(r.result); ui.impArm = true; renderSheet(); }; r.readAsText(el.files[0]); return; }
  if (el.id === 'fl-adate') { if (el.value) { ui.draft.anchorDate = el.value; renderFlow(); } return; }
  if (el.id === 'fl-wdate') { if (el.value) { ui.draft.windowUntil = el.value; renderFlow(); } return; }
  if (el.id === 'tt-show') { state.showClasses = el.checked; commit(); return; }
  if (el.dataset.commute) { state.commute = Object.assign({}, state.commute, { [el.dataset.commute]: clamp(Math.round(+el.value || 0), 0, 240) }); commit({ sheet: false }); toast('Travel time saved'); return; }
  if (el.dataset.tt) { const [cid, key] = el.dataset.tt.split('|'); const c = state.classes.find(x => x.id === cid); if (c) { c[key] = key === 'dow' ? +el.value : el.value; commit({ sheet: false }); } return; }
  if (el.dataset.stageToggle) { const [vid, sid] = el.dataset.stageToggle.split('|'); const s = (vec(vid) || { stages: [] }).stages.find(x => x.id === sid); if (s) { s.done = el.checked; commit(); } return; }
  if (!sh) return;
  if (sh.type === 'vector') {
    const v = vec(sh.id); if (!v) return;
    if (el.id === 'vs-title') { v.title = el.value.trim() || v.title; commit({ sheet: false }); }
    else if (el.id === 'vs-note') { v.note = el.value; commit({ sheet: false }); }
    else if (el.id === 'vs-date') { const mv = setAnchor(v, el.value || null); commit(); if (mv) toast(moveMsg(v)); }
    else if (el.id === 'vs-time') { if (v.anchor) { v.anchor.time = el.value || null; commit(); } }
    else if (el.id === 'vs-window') { const mv = setWindow(v, el.value || null); commit(); if (mv) toast(moveMsg(v)); }
    else if (el.id === 'vs-field') { v.fieldId = el.value || null; commit(); }
  }
}

// The small add-forms (new field, drop, stage). Inside Claude the page runs in a frame that
// blocks form submission, so the button click and Enter call this directly.
document.addEventListener('submit', e => { e.preventDefault(); submitForm(e.target); });
function submitForm(f) {
  if (!f) return;
  if (f.dataset.form === 'add-field') {
    const inp = $('#nf-input'), name = inp.value.trim(); if (!name) { inp.focus(); return; }
    let ex = state.fields.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (!ex) { ex = { id: uid(), name }; state.fields.push(ex); commit(); }
    ui.draft.fieldId = ex.id; goStep(1);
  } else if (f.dataset.form === 'drop') {
    const inp = $('#drop-in'), text = inp.value.trim(); if (!text) return;
    const nd = { id: uid(), text, at: Date.now(), seen: true }; state.drops.push(nd); ui.dropSel = nd.id; commit(); toast(`Dropped · ${text}`);
    setTimeout(() => { const i = $('#drop-in'); i && i.focus(); }, 0);
  } else if (f.dataset.form === 'ev-add') {
    const inp = $('#ev-title'), title = inp.value.trim(), date = f.dataset.day || ($('#ev-date') || {}).value; if (!title || !date) { inp.focus(); return; }
    state.events.push({ id: uid(), date, time: ($('#ev-time') || {}).value || null, title });
    commit(); toast(`Added · ${title} · ${dayLabel(date)}`); setTimeout(() => { const i = $('#ev-title'); i && i.focus(); }, 0);
  } else if (f.dataset.form === 'at-add') {
    const inp = $('#at-in'), names = inp.value.split(',').map(x => x.trim()).filter(Boolean); if (!names.length) { inp.focus(); return; }
    const now = Date.now(); names.forEach((name, i) => state.atlas.push({ id: uid(), parent: ui.atlas || null, name, note: '', rating: 0, remind: 0, createdAt: now + i }));
    commit(); setTimeout(() => { const i = $('#at-in'); i && i.focus(); }, 0);
  } else if (f.dataset.form === 'sync') {
    const inp = $('#sync-token'), token = inp.value.trim(); if (!token) { inp.focus(); return; }
    setSyncCfg({ token }); renderSheet(); initGist();
  } else if (f.dataset.form === 'v-stage') {
    const inp = $('#vs-stage-new'), text = inp.value.trim(); if (!text) return;
    const v = vec(ui.sheet.id); v.stages.push({ id: uid(), text, done: false }); commit();
    setTimeout(() => { const i = $('#vs-stage-new'); i && i.focus(); }, 0);
  }
}

document.addEventListener('keydown', e => {
  const el = e.target, typing = /INPUT|TEXTAREA|SELECT/.test(el.tagName);
  // Enter in one of the small add-forms adds the item
  const af = e.key === 'Enter' && el.tagName === 'INPUT' && el.closest && el.closest('[data-form]');
  if (af) { e.preventDefault(); submitForm(af); return; }
  // slider keys
  if (el.classList && el.classList.contains('track')) {
    const cur = +el.getAttribute('aria-valuenow');
    if (['ArrowRight', 'ArrowUp'].includes(e.key)) { e.preventDefault(); applyTrack(el.dataset.track, stepM(cur, 1), el, true); return; }
    if (['ArrowLeft', 'ArrowDown'].includes(e.key)) { e.preventDefault(); applyTrack(el.dataset.track, stepM(cur, -1), el, true); return; }
  }
  // comb keys
  const cell = el.closest && el.closest('#hive [data-cell]');
  if (cell && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); hiveActivate(cell.dataset.cell, true); return; }
  if (cell && (e.key === 'Escape' || e.key === 'Backspace') && ui.hive.path.length) { e.preventDefault(); hiveUp(null, true); return; }
  if (e.key === 'Enter' && ui.flowOpen) {
    if (el.id === 'fl-title') { e.preventDefault(); goStep(ui.step + 1); return; }
    if (el.id === 'fl-stage-new') {
      e.preventDefault(); const val = el.value.trim();
      if (val) { ui.draft.stages.push(val); ui.draft.stageDraft = ''; renderFlow(); const n = $('#fl-stage-new'); n && n.focus(); }
      else goStep(ui.step + 1);
      return;
    }
    if (el.dataset && el.dataset.stageIdx != null) { e.preventDefault(); const n = $('#fl-stage-new'); n && n.focus(); return; }
    if (e.metaKey || e.ctrlKey) { e.preventDefault(); launch(); return; }
    if (ui.step === 2 && el.classList && el.classList.contains('track')) { e.preventDefault(); goStep(3); return; }
  }
  if (e.key === 'Enter' && el.id === 'vs-title') { el.blur(); return; }
  if (e.key === 'Escape') {
    if (peekOf) { hidePeek(); return; }
    if (ui.flowOpen) closeFlow(); else if (ui.sheet) { if (ui.sheetStack.length) sheetBack(); else closeSheet(); } else if (ui.burnOpen) closeBurn();
    else if (ui.view === 'horizon' && ui.hive.path.length) hiveUp();
    return;
  }
  if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === 'n' || e.key === 'N') && !ui.flowOpen && !ui.burnOpen) { e.preventDefault(); openFlow(); }
  // D: drop a thought (the bar on Horizon, or the Drop sheet anywhere else)
  if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey && (e.key === 'd' || e.key === 'D') && !ui.flowOpen && !ui.burnOpen) {
    e.preventDefault(); const q = !ui.sheet && $('#dq-in');
    if (q) q.focus(); else { openSheet('mod', 'drop'); setTimeout(() => { const i = $('#drop-in'); i && i.focus(); }, 60); }
  }
});

// desktop drag-and-drop: a vector onto a day in Trajectory
document.addEventListener('dragstart', e => { const d = e.target.closest && e.target.closest('[data-drag]'); if (!d) return; e.dataTransfer.setData('text/plain', d.dataset.drag); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => { const c = e.target.closest && e.target.closest('[data-drop-day]'); if (!c) return; e.preventDefault(); $$('.day-col.drop').forEach(x => x !== c && x.classList.remove('drop')); c.classList.add('drop'); });
document.addEventListener('dragleave', e => { const c = e.target.closest && e.target.closest('[data-drop-day]'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('drop'); });
document.addEventListener('drop', e => {
  const c = e.target.closest && e.target.closest('[data-drop-day]'); if (!c) return; e.preventDefault(); c.classList.remove('drop');
  const v = vec(e.dataTransfer.getData('text/plain')); if (!v) return;
  const mv = setAnchor(v, c.dataset.dropDay); commit(); toast(mv ? moveMsg(v) : `Anchored · ${dayLabel(c.dataset.dropDay)}`);
});

// refresh "today" when the day rolls over while the app is open
let lastDay = todayKey();
setInterval(() => { const k = todayKey(); if (k !== lastDay) { lastDay = k; renderView(); } }, 60000);

/* ============================================================
   BOOT
   ============================================================ */
renderAll();
if (/debug/.test(location.hash)) window.KAIROS_DEBUG = { moModel, moMovers, state: () => state }; // dev aid: open the page with #debug
if (state.active && !state.active.paused) wakeOn();
// the start-up animation stays until the planets have settled (about 2 s) and your
// account data has arrived, but never longer than 3.2 s; a click skips it
const bootEl = $('#boot');
let bootGone = false;
const bootDone = () => { if (bootGone || !bootEl) return; bootGone = true; bootEl.classList.add('out'); viewIn(0); setTimeout(() => bootEl.remove(), 600); };
if (bootEl) bootEl.addEventListener('click', bootDone);
// the installed app: keep a copy for offline use (not possible inside Claude, where this quietly does nothing)
if ('serviceWorker' in navigator && !window.claude && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
// shortcuts from the app icon (right-click it in the Start menu or taskbar): #new, #drop
const startHash = (location.hash || '').slice(1);
if (startHash === 'new' || startHash === 'drop') {
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  setTimeout(() => { if (startHash === 'new') openFlow(); else openSheet('mod', 'drop'); }, REDUCED ? 350 : 2100);
}
Promise.race([initCloud().catch(() => {}), sleep(3200)]).then(() => setTimeout(bootDone, Math.max(0, (REDUCED ? 300 : 2000) - performance.now())));
})();

</script>
