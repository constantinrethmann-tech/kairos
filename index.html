.ms-c{display:flex;flex-direction:column;gap:5px;min-width:0}
.ms-c span{font-size:11.5px;color:var(--dust)}
.ms-c b{font-family:var(--f-mono);font-weight:300;font-size:15px;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.ms-c b small{margin-left:6px;font-size:9.5px;color:var(--dust)}
@media (max-width:760px){.mo-stats{grid-template-columns:1fr;gap:18px}}
.mo-mk{stroke:var(--void);stroke-width:1}
.mo-mk.up{fill:var(--ion);filter:drop-shadow(0 0 3px rgba(143,179,255,.8))}
.mo-mk.up.land{fill:var(--up);filter:drop-shadow(0 0 3px rgba(70,217,149,.7))}
.mo-mk.down{fill:var(--down)}
.movers{display:flex;flex-direction:column;border-top:1px solid var(--seam)}
.mover{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:11px 2px;border-bottom:1px solid var(--seam)}
.mv-t{font-size:14px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.mv-s{grid-column:1;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;line-height:1.5;text-transform:uppercase;color:var(--dust)}
.mv-p{grid-column:2;grid-row:1 / span 2;align-self:center;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.mover.live .mv-t::after{content:"LIVE";margin-left:8px;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.14em;color:var(--ion);vertical-align:2px}
.mo-how{margin-top:14px}
.mo-how summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font-size:13px;color:var(--mist)}
.mo-how summary::-webkit-details-marker{display:none}
.mo-how summary:hover{color:var(--frost)}
.mo-how summary svg{width:10px;height:10px;transition:transform .2s}
.mo-how[open] summary svg{transform:rotate(180deg)}
.mo-how-lead{margin:12px 0 0;font-size:13px;line-height:1.55;color:var(--mist)}
.mo-rate{width:100%;margin-top:12px;border-collapse:collapse;font-size:12.5px}
.mo-rate td{padding:8px 0;border-bottom:1px solid var(--seam);vertical-align:top;color:var(--mist)}
.mo-rate td:first-child{padding-right:12px;color:var(--frost)}
.mo-rate td:nth-child(2){font-family:var(--f-mono);font-size:10.5px;letter-spacing:.02em;line-height:1.6}
.mo-rate td:nth-child(3){padding-left:10px;text-align:right;white-space:nowrap;font-family:var(--f-mono);font-size:12px}
.mo-rate td[colspan]{font-family:var(--f-body);font-size:12.5px;letter-spacing:0}
.mo-rate td.up{color:var(--up)}
.mo-rate td.down{color:var(--down)}
.mo-rate small{display:block;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dust)}
.mo-how-foot{margin-top:12px;font-size:12px;line-height:1.55}
.mo-how ul{display:flex;flex-direction:column;gap:9px;margin:12px 0 0;padding:0;list-style:none;font-size:13px;line-height:1.5;color:var(--mist)}
.mo-how li b{font-weight:500;color:var(--frost)}
.mo-how li b.up{color:var(--up)}
.mo-how li b.down{color:var(--down)}
.mo-mini{display:flex;flex-direction:column;gap:8px;width:100%;padding:16px 16px 12px;border-radius:16px;border:1px solid var(--seam-2);background:var(--hull);text-align:left;transition:border-color .15s}
.mo-mini:hover{border-color:var(--seam-3)}
.mm-top{display:flex;align-items:center;gap:10px}
.mm-chg{margin-left:auto;font-family:var(--f-mono);font-size:11px}
.mm-chg.up{color:var(--up)}
.mm-chg.down{color:var(--down)}
.mm-val{font-family:var(--f-mono);font-weight:200;font-size:30px;letter-spacing:-.04em;line-height:1.1}
.mo-spark{width:100%;height:auto}
.mo-spark .mo-line{stroke-width:1.6}
.mm-foot{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:8.5px;color:var(--dust)}
.burn-mo{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:20px;font-family:var(--f-mono);font-size:11.5px;color:var(--mist)}
.burn-mo b{font-weight:400;color:var(--frost)}
.burn-mo.up > span:nth-child(3){color:var(--up)}
.burn-mo.down > span:nth-child(3){color:var(--down)}
.burn-mo .w{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust)}
.mv-note{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--flare)}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:9px;height:8px;background:var(--seam-3);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.pips i.on{background:var(--ion)}
.rank-row{color:var(--frost);gap:10px}
.rk-leg span{display:inline-flex;align-items:center;gap:6px}

/* toast + tooltip */
.toast{position:fixed;z-index:90;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 16px;border-radius:10px;background:var(--frost);color:var(--void);font-size:13.5px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:fadeUp .2s ease-out;--tx:-50%}
.tip{position:fixed;z-index:95;pointer-events:none;padding:6px 9px;border-radius:7px;background:var(--hull-3);border:1px solid var(--seam-2);font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--frost);white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,.5)}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes viewIn{from{opacity:0;transform:translate(var(--dx,0px),var(--dy,8px))}to{opacity:1;transform:none}}
.view.vin > *{animation:viewIn .36s var(--ease) both}
.view.vin > *:nth-child(2){animation-delay:.03s}
.view.vin > *:nth-child(3){animation-delay:.06s}
.view.vin > *:nth-child(4){animation-delay:.09s}
.view.vin > *:nth-child(n+5){animation-delay:.12s}
.mo-chart.fade{animation:fadeIn .28s ease-out}
html{scroll-behavior:smooth}
.btn-ghost,.btn-text,.chip,.seg2 button,.icon-btn,.mo-ct,.ignite,.field-chip,.grav-row,.mode,.day{transition-property:background,border-color,color,box-shadow,transform,opacity;transition-duration:.15s}
.btn-ghost:active,.chip:active,.seg2 button:active,.icon-btn:active,.mo-ct:active,.ignite:active,.field-chip:active,.grav-row:active,.mode:active,.day:active{transform:scale(.97)}
@keyframes fadeUp{from{opacity:0;transform:translate(var(--tx,0),8px)}to{opacity:1;transform:translate(var(--tx,0),0)}}
@keyframes stepIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes sheetIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
/* orbit map, second pass: hexagon moons on two tracks, a hexagon planet whose rim fills with progress */
@keyframes mRing{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}

/* Drop: a night sky of thoughts. Each drop is a star with its words beside it */
.dsky{position:relative;flex:none;width:100%;aspect-ratio:5/4;margin:4px 0 2px;border-radius:20px;border:1px solid var(--seam-2);overflow:hidden;background:radial-gradient(90% 60% at 25% 15%,rgba(79,116,196,.18),transparent 65%),radial-gradient(70% 55% at 85% 95%,rgba(180,156,255,.09),transparent 60%),linear-gradient(160deg,transparent 35%,rgba(143,179,255,.04) 50%,transparent 65%),#06070B}
.dsky > svg{position:absolute;inset:0;width:100%;height:100%}
@media (max-width:559px){.dsky{aspect-ratio:1}}
.dsky .dust{fill:#E9ECF1}
.dsky .cl line{stroke:rgba(143,179,255,.26);stroke-width:1;stroke-dasharray:1 5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ds-n{position:absolute;top:12px;left:14px;display:flex;align-items:baseline;gap:7px;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust)}
.ds-n b{font-weight:300;font-size:18px;letter-spacing:-.02em;color:var(--frost)}
.star{position:absolute;display:grid;grid-template-columns:14px auto;gap:0 7px;align-items:start;width:max-content;padding:2px 6px 3px 0;border-radius:8px;text-align:left;transition:opacity .2s}
.star .sp{grid-row:1 / span 2;position:relative;width:14px;height:14px;margin-top:1px;transform:scale(var(--s));transition:transform .25s var(--ease)}
.star .sp::before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff;box-shadow:0 0 5px 2px rgba(143,179,255,.75),0 0 14px 4px rgba(143,179,255,.25)}
.star .sp::after{content:"";position:absolute;inset:-3px;background:linear-gradient(90deg,transparent 46%,rgba(210,222,255,.85) 50%,transparent 54%),linear-gradient(0deg,transparent 46%,rgba(210,222,255,.85) 50%,transparent 54%);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 62%);mask-image:radial-gradient(circle,#000 10%,transparent 62%)}
.star .st{font-size:12px;line-height:1.35;color:var(--mist);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;transition:color .15s}
.star em{font-style:normal;font-family:var(--f-mono);font-size:8.5px;letter-spacing:.08em;color:var(--dust);opacity:.8}
.star:hover .st,.star.sel .st{color:var(--frost)}
.star:hover .sp{transform:scale(calc(var(--s) * 1.25))}
.star.sel .sp::before{box-shadow:0 0 0 5px rgba(143,179,255,.16),0 0 6px 2px rgba(143,179,255,.95),0 0 18px 6px rgba(143,179,255,.35)}
.star.new .sp{animation:twinkle 1.8s ease-in-out infinite}
.star.new .sp::before{background:#FFE9C2;box-shadow:0 0 6px 2px rgba(240,180,94,.8),0 0 16px 5px rgba(240,180,94,.25)}
.star.new .st{color:var(--frost)}
@keyframes twinkle{50%{transform:scale(calc(var(--s) * .55));opacity:.55}}
.star.done{opacity:.55}
.star.done .sp::before{width:3px;height:3px;margin:-1.5px;background:var(--seam-3);box-shadow:none}
.star.done .sp::after{display:none}
.star.done .st{color:var(--dust);text-decoration:line-through;text-decoration-color:var(--seam-3)}

/* Sunday review: next week's days light up with what is already planned */
.plan-days button.has{background:rgba(79,116,196,calc(.35 + var(--l) * .65));color:var(--frost)}
.plan-days button.has.has-cls{background:linear-gradient(rgba(79,116,196,calc(.3 + var(--l) * .6)),rgba(79,116,196,calc(.3 + var(--l) * .6))),repeating-linear-gradient(135deg,#3A404B 0 2px,#272C36 2px 4px)}
.plan-days button.has:hover,.plan-days button:hover{background:var(--ion);color:var(--void)}

/* Debrief: classes listed with their times, outside the score */
.db-cls{display:grid;gap:6px;padding:12px 14px;border-radius:12px;border:1px solid var(--seam);background:repeating-linear-gradient(135deg,rgba(58,64,75,.10) 0 2px,transparent 2px 7px)}
.db-cls .eyebrow{margin-bottom:2px}
.db-cls div{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:13.5px;color:var(--mist)}
.db-cls .mono{font-size:10.5px;color:var(--dust)}
.db-cls b{font-family:var(--f-mono);font-weight:300;font-size:12px;color:var(--mist)}
.db-cls .tv span:nth-child(2){color:var(--dust)}

/* Telemetry overview */
.tov{margin-bottom:38px}
.tov-h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px 40px;align-items:end;padding-bottom:22px}
.tov-big{display:grid;gap:4px}
.tov-big b{font-family:var(--f-mono);font-weight:200;font-size:clamp(40px,6vw,58px);letter-spacing:-.05em;line-height:1}
.tov-big em{font-style:normal;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em}
.tov-big em.up{color:var(--up)}.tov-big em.down{color:var(--down)}
.tov-mini{display:flex;gap:30px;padding-bottom:4px}
.tov-mini div{display:grid;gap:2px}
.tov-mini b{font-family:var(--f-mono);font-weight:300;font-size:20px;letter-spacing:-.03em}
.tov-mini span{font-family:var(--f-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dust)}
.tov-rng{align-self:start}
.tov-split{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.tov-split i{min-width:3px;background:rgba(143,179,255,var(--o));box-shadow:0 0 10px rgba(143,179,255,calc(var(--o) * .4))}
.tov-leg{display:flex;flex-wrap:wrap;gap:6px 22px;margin:12px 0 18px;font-size:12.5px;color:var(--mist)}
.tov-leg span{display:inline-flex;align-items:center;gap:8px}
.tov-leg i{width:9px;height:8px;background:rgba(143,179,255,var(--o));clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.tov-leg b{font-family:var(--f-mono);font-weight:400;font-size:10.5px;color:var(--dust)}
.tv-list{display:grid;border-top:1px solid var(--seam)}
.tv-row{display:grid;grid-template-columns:12px minmax(0,1.3fr) minmax(0,1fr) 64px;gap:14px;align-items:center;width:100%;padding:11px 0;border-bottom:1px solid var(--seam);text-align:left}
button.tv-row:hover .tv-t b{color:var(--ion)}
.tv-row .hx{width:10px;height:9px;background:rgba(143,179,255,var(--o));clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.tv-row .hx.l{background:var(--up)}
.tv-t{display:grid;gap:2px;min-width:0}
.tv-t b{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .15s}
.tv-t em{font-style:normal;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.08em;color:var(--dust);text-transform:uppercase}
.tv-bar{height:4px;border-radius:2px;background:var(--hull-2);overflow:hidden}
.tv-bar i{display:block;height:100%;border-radius:2px;background:rgba(143,179,255,max(var(--o),.45))}
.tv-m{font-family:var(--f-mono);font-size:12px;text-align:right}
.tv-more{padding-top:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;color:var(--dust)}
@media (max-width:760px){.tov-h{grid-template-columns:minmax(0,1fr)}.tov-rng{order:-1}.tov-mini{gap:22px}.tv-row{grid-template-columns:12px minmax(0,1fr) 56px}.tv-bar{display:none}}

/* start-up animation */
#boot{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(60% 50% at 50% 45%,#0B1020,var(--void) 70%);transition:opacity .5s ease,visibility 0s .5s}
#boot.out{opacity:0;visibility:hidden;pointer-events:none}
.bt-sys{width:min(62vw,290px);height:auto;overflow:visible}
.bt-o{fill:none;stroke:rgba(143,179,255,.22);stroke-width:.6;stroke-dasharray:1.2 2.6;animation:btO .8s var(--ease) both;animation-delay:calc(var(--i) * 90ms)}
@keyframes btO{from{opacity:0;transform:scale(.55) rotate(-40deg)}}
.bt-p{animation:btSpin 3.2s linear both;animation-delay:calc(250ms + var(--i) * 110ms)}
.bt-p circle{fill:var(--ion);filter:drop-shadow(0 0 4px rgba(143,179,255,.9));animation:btIn .95s cubic-bezier(.16,.84,.24,1) both;animation-delay:calc(250ms + var(--i) * 110ms)}
.bt-p:nth-of-type(odd) circle{fill:#E9ECF1}
@keyframes btSpin{from{transform:rotate(var(--a))}to{transform:rotate(calc(var(--a) + 70deg))}}
@keyframes btIn{from{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.3)}60%{opacity:1}}
.bt-core{fill:#0C111B;stroke:var(--ion);stroke-width:1.2;filter:drop-shadow(0 0 6px rgba(143,179,255,.8));animation:btCore 1.6s ease-in-out both}
@keyframes btCore{0%{opacity:0;transform:scale(.4)}30%{opacity:1;transform:scale(1)}75%{fill:#0C111B}90%{fill:rgba(143,179,255,.55)}100%{fill:#0C111B}}
.bt-ring{fill:none;stroke:var(--ion);stroke-width:.8;opacity:0;animation:btRing .9s ease-out 1.25s both}
@keyframes btRing{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(7.5)}}
.bt-halo{animation:btHalo 1.8s ease-out both}
@keyframes btHalo{from{opacity:0;transform:scale(.4)}}
.bt-wm{font-family:var(--f-display);font-size:14px;letter-spacing:.62em;padding-left:.62em;color:var(--frost);animation:btWm 1.1s var(--ease) .2s both}
@keyframes btWm{from{opacity:0;letter-spacing:1.1em;filter:blur(3px)}}
.bt-bar{width:120px;height:1px;background:var(--seam-2);overflow:hidden}
.bt-bar i{display:block;height:100%;background:var(--ion);box-shadow:0 0 8px var(--ion);animation:btBar 1.5s cubic-bezier(.4,0,.2,1) both}
@keyframes btBar{from{width:0}to{width:100%}}

/* honeycomb calendar (Trajectory) */
.cal{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:8px 40px;align-items:start}
@media (max-width:900px){.cal{grid-template-columns:minmax(0,1fr)}}
.cal-head{display:flex;align-items:center;gap:10px}
.cal-nav{display:flex;align-items:center;gap:2px}
.cal-nav .mono{font-size:10px;letter-spacing:.14em;color:var(--mist);padding:0 6px;white-space:nowrap}
.hc{display:block;width:100%;max-width:640px;height:auto;margin-top:10px}
.hc .day{cursor:pointer;outline:none}
.hc .hex{fill:#0E1117;stroke:var(--seam-2);stroke-width:1;transition:stroke .12s}
.hc .day.past .hex{fill:#0B0D11}

<script>
(() => {
'use strict';

/* ============================================================
   KAIROS — set a vector, give it a burn, ignite.
   Vanilla JS, no build step. State lives in one JSON object.
   ============================================================ */

// ---------- tiny helpers ----------
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clone = o => JSON.parse(JSON.stringify(o));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// ---------- dates (local calendar days as YYYY-MM-DD keys) ----------
const DOW = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
const DOW_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
const MON_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => dkey(new Date());
const k2d = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = k2d(k); d.setDate(d.getDate() + n); return dkey(d); };
const endOfWeek = () => { const t = todayKey(), d = k2d(t).getDay(); return addDays(t, d === 0 ? 7 : 7 - d); };
const dayLabel = k => {
  const t = todayKey();
  if (k === t) return 'Today';
  if (k === addDays(t, 1)) return 'Tomorrow';
  if (k === addDays(t, -1)) return 'Yesterday';
  const d = k2d(k); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
};
const shortDay = k => { const d = k2d(k); return `${DOW[d.getDay()]} ${d.getDate()}`; };
const fmtMin = m => { m = Math.round(m); if (m < 60) return `${m} min`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h}h ${pad(r)}m` : `${h}h`; };
const fmtClock = ms => { const s = Math.max(0, Math.round(ms / 1000)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${pad(m)}:${pad(x)}` : `${pad(m)}:${pad(x)}`; };
const hhmm = ts => { const d = new Date(ts); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };

// ---------- vocabulary ----------
const GRAVITY = { 5: ['Critical', 'Has to happen'], 4: ['Heavy', 'Strong pull, do it soon'], 3: ['Steady', 'Normal weight'], 2: ['Light', 'When there is room'], 1: ['Drift', 'Nice to do'] };
const PLACEHOLDER = { Programming: 'Build the login screen', Study: 'Chapter 4 exercises', Fitness: 'Interval run', Reading: 'Next 30 pages', Languages: 'Spanish vocab, unit 3', Admin: 'Reply to emails' };
const GROUP = {
  today: { name: 'Today', desc: 'Anchored to today, plus anything carried over.', empty: 'Nothing anchored to today. Pull something up from Floating or Windows.' },
  windows: { name: 'Windows', desc: 'Any time before a deadline. Closing soonest first.', empty: 'No open windows. Give a vector a deadline and it lands here.' },
  ahead: { name: 'Ahead', desc: 'Anchored to a later day.', empty: 'Nothing anchored to a later day.' },
  landed: { name: 'Landed', desc: 'Done in the last 7 days.', empty: 'Nothing landed this week yet.' },
  floating: { name: 'Floating', desc: 'No day and no deadline. Pick one up whenever you have time.', empty: 'Nothing floating.' }
};
const RING_ORDER = ['today', 'windows', 'ahead', 'landed', 'floating']; // clockwise from the top cell

// ---------- burn scale: 0–60 min fills the first half, 1–4 h the second ----------
const MAXM = 240;
const SNAPS = []; for (let m = 5; m <= 60; m += 5) SNAPS.push(m); for (let m = 75; m <= MAXM; m += 15) SNAPS.push(m);
const MAJ = [15, 30, 45, 60, 90, 120, 180, 240];
const m2x = m => { m = clamp(m, 0, MAXM); return m <= 60 ? m / 120 : 0.5 + (m - 60) / 360; };
const x2m = x => { x = clamp(x, 0, 1); return x <= 0.5 ? x * 120 : 60 + (x - 0.5) * 360; };
const snapM = m => clamp(m <= 60 ? Math.round(m / 5) * 5 : Math.round(m / 15) * 15, 5, MAXM);
const snapUp = m => SNAPS.find(s => s >= m) || MAXM;
const stepM = (m, dir) => dir > 0 ? (SNAPS.find(s => s > m) || MAXM) : ([...SNAPS].reverse().find(s => s < m) || 5);
const tickLabel = m => m < 60 ? String(m) : (m % 60 ? `${Math.floor(m / 60)}H${m % 60}` : `${m / 60}H`);
const bigVal = m => m < 60 ? String(m) : `${Math.floor(m / 60)}:${pad(m % 60)}`;
const bigUnit = m => m < 60 ? 'MIN' : 'HRS';

// ---------- hex geometry (flat-top) ----------
const SQ3 = Math.sqrt(3);
const HEXA = [240, 300, 0, 60, 120, 180].map(d => d * Math.PI / 180); // starts top-left, runs clockwise
const hexPts = (cx, cy, R) => HEXA.map(a => `${(cx + R * Math.cos(a)).toFixed(1)},${(cy + R * Math.sin(a)).toFixed(1)}`).join(' ');
const axXY = (q, r) => [1.5 * q, SQ3 * (r + q / 2)];
const angOf = ([q, r]) => { const [x, y] = axXY(q, r); let a = Math.atan2(x, -y); if (a < -1e-9) a += 2 * Math.PI; return a; };
const RINGS = [1, 2].map(n => { const out = []; for (let q = -n; q <= n; q++) for (let r = -n; r <= n; r++) if ((Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2 === n) out.push([q, r]); return out.sort((a, b) => angOf(a) - angOf(b)); });
const hexGlyph = pct => { const p = hexPts(15, 13, 11.5); return `<svg class="hexg ohex" viewBox="0 0 30 26" aria-hidden="true"><polygon class="b" points="${p}"/>${pct > 0 ? `<polygon class="p" pathLength="100" stroke-dasharray="${Math.min(100, pct).toFixed(1)} 100" points="${p}"/>` : ''}</svg>`; };

// ---------- icons ----------
const I = {
  play: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.2 1.2v7.6L8.6 5z" fill="currentColor"/></svg>',
  pause: '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.3 1.5h1.8v7H2.3zM5.9 1.5h1.8v7H5.9z" fill="currentColor"/></svg>',
  x: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>',
  plus: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>',
  down: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  left: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  right: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5L8 6 4.5 9.5" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  check: '<svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2l2.4 2.4 4.6-5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  float: '<svg viewBox="0 0 26 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round"><polygon points="15.5,3.5 20.5,3.5 23,8 20.5,12.5 15.5,12.5 13,8"/><path d="M2 8h2.5M6.5 8H9" /></svg>',
  anchor: '<svg viewBox="0 0 26 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 15.5h22"/><path d="M13 4.5v11"/><circle cx="13" cy="3.5" r="2" fill="currentColor" stroke="none"/></svg>',
  window: '<svg viewBox="0 0 26 18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><path d="M2 15.5h22"/><path d="M5 5v10.5M21 5v10.5"/><path d="M8 10h10" stroke-dasharray="1.5 2.5"/></svg>'
};
const gbars = (g, lg) => `<span class="gbars g${g}${lg ? ' lg' : ''}" title="Gravity ${g}: ${GRAVITY[g][0]}" aria-label="Gravity ${g}, ${GRAVITY[g][0]}"><i></i><i></i><i></i><i></i><i></i></span>`;

/* ============================================================
   STATE
   ============================================================ */
const LS_KEY = 'kairos.state.v1';
const LS_VIEW = 'kairos.view';
const SEED_V = 5;

function seed() {
  const t = todayKey(), now = Date.now(), D = 864e5;
  const fields = [['f-prog', 'Programming'], ['f-study', 'Study'], ['f-fit', 'Fitness'], ['f-read', 'Reading'], ['f-lang', 'Languages'], ['f-admin', 'Admin']].map(([id, name]) => ({ id, name }));
  const orbits = [{ id: 'o-kairos', name: 'KAIROS app', fieldId: 'f-prog', note: 'Build my own focus organizer with Claude Code.', createdAt: now - 9 * D, landedAt: null, sample: true }];
  const V = (id, title, fieldId, orbitId, burnMin, gravity, anchor, win, stages, landedDaysAgo) => ({
    id, title, note: '', fieldId, orbitId, burnMin, gravity, anchor, window: win ? { until: win } : null,
    stages: (stages || []).map(([text, done], i) => ({ id: id + 's' + i, text, done })),
    createdAt: now - 10 * D, landedAt: landedDaysAgo == null ? null : now - landedDaysAgo * D, sample: true
  });
  const vectors = [
    V('v1', 'Build the burn timer screen', 'f-prog', 'o-kairos', 90, 4, { date: t, time: '17:00' }, null, [['Drag track component', true], ['Countdown and overtime', false], ['Pause and resume', false]]),
    V('v6', 'Spanish vocab, unit 2', 'f-lang', null, 20, 2, { date: t, time: null }),
    V('v3', 'Problem set, chapter 3', 'f-study', null, 90, 5, null, addDays(t, 3), [['Questions 1–4', false], ['Questions 5–8', false]]),
    V('v7', 'Sort out bank letters', 'f-admin', null, 15, 3, null, addDays(t, 1)),
    V('v5', 'Easy run', 'f-fit', null, 45, 3, { date: addDays(t, 2), time: null }),
    V('v13', 'Plan next week', 'f-admin', null, 20, 2, { date: addDays(t, 3), time: null }),
    V('v2', 'Set up the project in Claude Code', 'f-prog', 'o-kairos', 25, 3, null),
    V('v4', 'Read 30 pages', 'f-read', null, 30, 2, null),
    V('v8', 'Sketch the KAIROS screens', 'f-prog', 'o-kairos', 60, 4, { date: addDays(t, -5), time: null }, null, [], 4),
    V('v9', 'Essay outline', 'f-study', null, 45, 4, { date: addDays(t, -4), time: null }, null, [], 3),
    V('v10', 'Mobility session', 'f-fit', null, 30, 2, null, null, [], 1),
    V('v12', 'Spanish vocab, unit 1', 'f-lang', null, 45, 2, null, null, [], 1),
    V('v11', 'Finish the novel', 'f-read', null, 90, 2, null, null, [], 8),
    // older example vectors, landed weeks ago (they give the Momentum chart some history)
    V('h1', 'Microeconomics problem set 1', 'f-study', null, 90, 4, null, null, [], 29),
    V('h2', 'Python loops exercises', 'f-prog', null, 60, 3, null, null, [], 26),
    V('h3', 'Upper body session', 'f-fit', null, 45, 2, null, null, [], 31),
    V('h4', 'Applied Math homework 2', 'f-study', null, 120, 4, { date: addDays(t, -17), time: null }, null, [], 16),
    V('h5', 'Business Law reading, ch. 1–2', 'f-read', null, 60, 3, null, null, [], 19),
    V('h6', 'Interval run', 'f-fit', null, 40, 3, null, null, [], 22),
    V('h7', 'Algorithmic Thinking lab prep', 'f-prog', null, 90, 4, null, null, [], 11)
  ];
  // Example history: 5 weeks with a slow start, a good week, a bad week, a strong week and a mixed one.
  let seedN = 20260924;
  const rnd = () => { seedN = (Math.imul(seedN, 1103515245) + 12345) >>> 0; return seedN / 4294967296; };
  const at = (daysAgo, h) => { const d = k2d(addDays(t, -daysAgo)); d.setHours(Math.floor(h), Math.round((h % 1) * 60), 0, 0); return d.getTime(); };
  const life = { h1: [35, 29], h2: [34, 26], h3: [33, 31], h4: [28, 16], h5: [27, 19], h6: [24, 22], h7: [17, 11], v11: [14, 8], v8: [10, 4], v9: [9, 3], v12: [12, 1], v10: [2, 1] };
  const sessions = [], dayQ = {};
  const S = (vid, startTs, min, plan, pauses) => {
    const v = vectors.find(x => x.id === vid);
    sessions.push({ id: uid(), vectorId: vid, fieldId: v.fieldId, title: v.title, start: startTs, min, plan, pauses: pauses || 0, g: v.gravity, day: dkey(new Date(startTs)), sample: true });
  };
  for (let d = 35; d >= 1; d--) {
    const k = addDays(t, -d), wk = k2d(k).getDay() % 6 === 0;
    const q = clamp([.66, .88, .2, .72, .4][Math.floor((d - 1) / 7)] + (rnd() - .5) * .44 - (wk ? .16 : 0), 0, 1);
    dayQ[d] = q;
    const n = q < .22 ? 0 : q < .45 ? 1 : q < .74 ? 2 : 3;
    const alive = Object.keys(life).filter(id => d <= life[id][0] && d >= life[id][1]);
    const slots = wk ? [10.5, 13.25, 16.75, 20] : [14.5, 16.75, 19.25, 21.5];
    for (let i = 0; i < n && alive.length; i++) {
      const vid = alive[Math.floor(rnd() * alive.length)];
      const plan = [20, 25, 30, 45, 60][Math.floor(rnd() * 5)];
      const f = q > .72 ? 1 + rnd() * 1.4 : q > .42 ? .85 + rnd() * .6 : .45 + rnd() * .6;
      S(vid, at(d, slots[i] + rnd() * .4), Math.max(5, Math.round(plan * f / 5) * 5), plan, rnd() < (1 - q) * .45 ? 1 : 0);
    }
  }
  S('v3', at(4, 16.2), 30, 30); S('v4', at(3, 22), 10, 30, 1); S('v1', at(2, 17.2), 35, 30);
  const nowH = new Date().getHours() + new Date().getMinutes() / 60;
  if (nowH >= 15.5) S('v1', at(0, 13.7), 40, 30);
  // landed examples land at the end of their last burn
  Object.keys(life).forEach(id => {
    const v = vectors.find(x => x.id === id), last = sessions.filter(s => s.vectorId === id).sort((a, b) => b.start - a.start)[0];
    v.createdAt = at(life[id][0], 9);
    v.landedAt = last ? last.start + last.min * 60000 : at(life[id][1], 20);
  });
  // postponed examples: each move dips the line
  const mv = (vid, daysAgo, h, k, from, to) => { const v = vectors.find(x => x.id === vid); (v.moves = v.moves || []).push({ at: at(daysAgo, h), k, from, to, g: v.gravity }); };
  mv('h4', 20, 22, 'a', addDays(t, -20), addDays(t, -19)); mv('h4', 19, 21, 'a', addDays(t, -19), addDays(t, -17));
  mv('v6', 2, 22.5, 'a', addDays(t, -2), addDays(t, -1)); mv('v6', 1, 23.1, 'a', addDays(t, -1), t);
  mv('v7', 1, 20, 'w', addDays(t, -1), addDays(t, 1));
  const debriefs = {};
  for (let d = 1; d <= 35; d++) {
    if ([13, 22, 23, 30].includes(d)) continue;
    const q = dayQ[d], screen = Math.round((310 - q * 210) / 15) * 15;
    debriefs[addDays(t, -d)] = { score: Math.round(clamp(30 + q * 62 + (rnd() - .5) * 12, 18, 97)), sample: true, screen, app: 'TikTok', appMin: Math.round(screen * .35 / 5) * 5, when: ['Evening'], energy: Math.round(clamp(2 + q * 3, 1, 5)) };

function normalize(s) {

// Swap older example data for the current examples (only while examples are still there).
function refreshSamples() {
  if ((state.seedV || 1) >= SEED_V) return false;
  state.seedV = SEED_V;
  const had = state.vectors.some(v => v.sample) || state.orbits.some(o => o.sample);
  if (!had) return true;
  const s = seed();
  state.vectors = state.vectors.filter(v => !v.sample).concat(s.vectors);
  state.orbits = state.orbits.filter(o => !o.sample).concat(s.orbits);
  state.sessions = state.sessions.filter(x => !x.sample).concat(s.sessions);
  s.fields.forEach(f => { if (!state.fields.some(x => x.id === f.id)) state.fields.push(f); });
  Object.keys(state.debriefs).forEach(k => { if (state.debriefs[k].sample) delete state.debriefs[k]; });
  Object.keys(s.debriefs).forEach(k => { if (!state.debriefs[k]) state.debriefs[k] = s.debriefs[k]; });

}

function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }

let state = normalize(loadLocal() || seed());

const ui = {

  sheet: null, sheetStack: [], confirm: null,
  flowOpen: false, step: 0, draft: null, flowReturn: null,
  burnOpen: false, dragging: false, chimed: null, liveTarget: null,

// ---------- lookups ----------
const vec = id => state.vectors.find(v => v.id === id);

function groups() {
  const t = todayKey(), open = state.vectors.filter(v => !v.landedAt);
  return {
    today: open.filter(v => v.anchor && v.anchor.date <= t).sort((a, b) => {
      const la = a.anchor.date < t, lb = b.anchor.date < t; if (la !== lb) return la ? -1 : 1; return byAnchor(a, b);
    }),
    windows: open.filter(v => !v.anchor && v.window).sort((a, b) => cmp(a.window.until, b.window.until) || b.gravity - a.gravity),

}

function windowInfo(v) {
  if (!v.window) return null;
  const t = todayKey(), u = v.window.until;
  if (u < t) return { txt: `Window closed · ${dayLabel(u)}`, short: 'closed', cls: 'late' };
  if (u === t) return { txt: 'Closes today', short: 'closes today', cls: 'late' };
  if (u === addDays(t, 1)) return { txt: 'Closes tomorrow', short: 'by tomorrow', cls: 'win' };

}

}

/* ============================================================
   PERSISTENCE — always saved in this browser first, then synced:
   · inside Claude: your Claude account (db capability)
   · as the installed app: one private file (a secret gist) in your GitHub account,
     reached with a token you paste once per device in Hangar → Sync & backup
   The newest save wins (updatedAt), the same rule on every device.
   ============================================================ */
let cloud = null, saveTimer = null, saving = false, savePending = false;

// save without redrawing (for fields you are still on, so the next click is not lost)
function quietSave() {

  saveLocal();
  if (cloud) { clearTimeout(saveTimer); saveTimer = setTimeout(flushCloud, cloud.gist ? 1500 : 500); }
}

}

async function flushCloud() {
  if (!cloud) return;
  if (saving) { savePending = true; return; }
  saving = true; setSync('saving');
  try { if (cloud.gist) await gistPush(); else await cloud.ref.set(clone(state)); setSync('ok'); }
  catch (e) {
    if (e && e.code === 'unavailable') { setTimeout(flushCloud, 1200 + Math.random() * 1200); }
    else if (e && e.code === 'quota_exceeded') { setSync('err'); toast('Storage is full. Clear old examples or landed vectors.'); }
    else { setSync('err'); if (cloud.gist) setTimeout(flushCloud, 30000); }
  }
  saving = false;
  if (savePending) { savePending = false; flushCloud(); }
}

function setSync(s) {
  const el = $('#sync'); if (!el) return;
  const where = cloud && cloud.gist || (!window.claude && syncCfg()) ? 'your GitHub' : 'your Claude account';
  const map = {
    local: ['', 'This device', 'Saved on this device only. Turn on sync in Hangar → Sync & backup.'],
    connecting: ['', 'Linking', `Connecting to ${where}`],
    ok: ['ok', 'Synced', `Saved to ${where}. Opens the same on phone and laptop.`],
    saving: ['ok', 'Saving', `Saving to ${where}`],
    err: ['err', 'Offline', `Could not reach ${where}. Changes are kept on this device and sent later.`]
  };
  const [cls, label, title] = map[s] || map.local;

// ---------- GitHub sync (the installed app) ----------
const LS_SYNC = 'kairos.sync', GIST_FILE = 'kairos-data.json';
const syncCfg = () => { try { return JSON.parse(localStorage.getItem(LS_SYNC) || 'null'); } catch (e) { return null; } };
const setSyncCfg = c => { try { c ? localStorage.setItem(LS_SYNC, JSON.stringify(c)) : localStorage.removeItem(LS_SYNC); } catch (e) {} };

  const c = syncCfg(); if (!c || !c.token) throw new Error('No token');

  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.status === 204 ? null : r.json();
}
// "Example only" = nothing of yours in it yet: every vector, burn and debrief is an example and there are no drops.
// A device that only holds examples never uploads them, and your real data always beats examples,
// whichever device connects first and whatever the clocks say.
const isExample = s => !!s && !(s.vectors || []).some(v => !v.sample) && !(s.sessions || []).some(x => !x.sample)
  && !Object.values(s.debriefs || {}).some(d => !d.sample) && !(s.drops || []).length && !(s.orbits || []).some(o => !o.sample) && !(s.atlas || []).some(n => !n.starter) && !(s.events || []).length;

  const c = syncCfg(); if (!c || !c.gist || isExample(state)) return;
  await gh('/gists/' + c.gist, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(state) } } }) });
  c.last = Date.now(); setSyncCfg(c);
}
async function gistPull() {
  const c = syncCfg(); if (!c || !c.gist) return;
  const g = await gh('/gists/' + c.gist), f = g.files && g.files[GIST_FILE]; if (!f) return;
  const txt = f.truncated ? await (await fetch(f.raw_url, { cache: 'no-store' })).text() : f.content;
  let remote = null; try { remote = normalize(JSON.parse(txt)); } catch (e) {}

  if (takeRemote) { state = remote; state.origin = 'cloud'; saveLocal(); renderAll({ remote: true }); }
  else if (!localEx && (remoteEx || (+remote.updatedAt || 0) < (+state.updatedAt || 0))) await gistPush();
  c.last = Date.now(); setSyncCfg(c);
}
// find the KAIROS file in your gists, or make it (secret) the first time
async function initGist() {
  const c = syncCfg(); if (!c || !c.token) { cloud = null; setSync('local'); return; }
  setSync('connecting');
  try {
    if (!c.gist) {
      const list = await gh('/gists?per_page=100'), found = list.find(x => x.files && x.files[GIST_FILE]);
      if (found) c.gist = found.id;
      else { const n = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: 'KAIROS sync — private app data', public: false, files: { [GIST_FILE]: { content: JSON.stringify(state) } } }) }); c.gist = n.id; }
      setSyncCfg(c);
    }
    cloud = { gist: true };
    await gistPull();
    setSync('ok');
  } catch (e) {
    cloud = c.gist ? { gist: true } : null;

// pick up changes from your other devices: when you come back to the app, and every minute while it is open
let pulling = false;
async function pullNow() { if (!cloud || !cloud.gist || pulling || saving || document.hidden) return; pulling = true; try { await gistPull(); if (ui.syncState !== 'ok') setSync('ok'); } catch (e) { setSync('err'); } pulling = false; }

setInterval(pullNow, 60000);

async function initCloud() {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { await initGist(); return; }
  setSync('connecting');
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch (e) {}
  if (!db || !user) { setSync('local'); return; }
  let id = null; try { id = await user.id(); } catch (e) {}
  if (!id) { setSync('local'); return; }
  let ref; try { ref = db.doc('data/users/' + id + '/kairos'); } catch (e) { setSync('local'); return; }
  let snap = null;
  for (let i = 0; i < 2 && !snap; i++) {

    catch (e) { if (e && e.code === 'unavailable' && i === 0) { await sleep(700 + Math.random() * 700); continue; } setSync('err'); return; }
  }
  if (!snap) { setSync('err'); return; }
  cloud = { ref };
  if (snap.exists) {

    if (state.origin === 'seed' || remote.updatedAt >= state.updatedAt) {
      state = remote; state.origin = 'cloud';
      if (refreshSamples()) commit(); else { saveLocal(); renderAll({ remote: true }); }

  } else { state.origin = 'cloud'; flushCloud(); }
  ref.onSnapshot(s => {
    if (!s.exists) return;
    const remote = s.data();
    if (remote && (+remote.updatedAt || 0) > (state.updatedAt || 0)) {

    }
  }, () => setSync('err'));
}

// ---------- comb gestures: slide to look, hold or release to open ----------

/* ============================================================
   HORIZON — the day numbers, the board or the comb, then the plan below
   ============================================================ */
const fmtH = h => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return `${pad(hh % 24 + (mm === 60 ? 1 : 0))}:${pad(mm % 60)}`; };

// Everything the day map needs: fixed classes, burns done, timed plans,
// untimed vectors slotted into free gaps ("ghosts"), and what is left free.
function dayModel(t) {
  const H0 = 7, H1 = 24, tk = todayKey(), isToday = t === tk;
  const now = isToday ? clamp(nowHours(), H0, H1) : t < tk ? H1 : H0;
  const bm = burnMap();
  const cls = classesOn(t).map(c => ({ a: hm(c.s), b: hm(c.e), kind: 'cls', label: c.short || c.t, tip: `Class · ${c.t} · ${c.s}–${c.e}` }));
  const done = state.sessions.filter(s => s.day === t).map(s => { const d = new Date(s.start), a = d.getHours() + d.getMinutes() / 60; const ttl = (vec(s.vectorId) || s).title; return { a, b: a + s.min / 60, kind: 'done', label: ttl, tip: `Burned · ${ttl} · ${s.min} min`, v: vec(s.vectorId) }; });
  if (isToday && state.active) {
    const v = vec(state.active.vectorId), el = elapsedMs(state.active) / 3600000;
    if (v && el > 0.01) done.push({ a: nowHours() - el, b: nowHours(), kind: 'live', label: v.title, tip: `Burning · ${v.title}`, v });
  }
  const open = state.vectors.filter(v => !v.landedAt && v.anchor && v.anchor.date === t);
  const timed = open.filter(v => v.anchor.time).map(v => { const a = hm(v.anchor.time), rem = Math.max(5, v.burnMin - (bm[v.id] || 0)); return { a, b: a + rem / 60, kind: 'plan', label: v.title, tip: `Planned · ${v.title} · ${v.anchor.time} · ${rem} min`, v }; });
  const trav = travelOn(t);
  const busy = [...cls, ...trav, ...timed, ...done].map(s => [s.a, s.b]);
  const untimed = open.filter(v => !v.anchor.time).concat(isToday ? state.vectors.filter(v => !v.landedAt && v.anchor && v.anchor.date < t) : []).sort(byGravity);
  const ghosts = []; let cursor = Math.max(now, H0);
  untimed.forEach(v => {

    if (s + dur <= H1) { ghosts.push({ a: s, b: s + dur, kind: 'ghost', label: v.title, tip: `Fits here · ${v.title} · ${fmtH(s)}`, v }); busy.push([s, s + dur]); cursor = s + dur; }
  });
  const sorted = busy.slice().sort((x, y) => x[0] - y[0]);
  const free = []; let c = Math.max(now, H0);
  for (const [a, b] of sorted) { if (b <= c) continue; if (a > c + 1e-6) free.push([c, Math.min(a, H1)]); c = Math.max(c, b); }
  if (c < H1) free.push([c, H1]);

  return { H0, H1, now, isToday, cls, trav, done, timed, ghosts, free, freeMin };
}

function tlVec(v, bm, when, late, landed, lift) {
  const burned = bm[v.id] || 0, live = state.active && state.active.vectorId === v.id;
  const w = !landed && windowInfo(v);
  return `<div class="tl-row vec${late ? ' late' : ''}${landed ? ' landed' : ''}${live ? ' live' : ''}" style="--p:${(clamp(burned / v.burnMin, 0, 1) * 100).toFixed(1)}%">
    <span class="tm">${esc(when)}</span><span class="mk"></span>
    <button class="bd" data-open-vector="${v.id}"><span class="tt">${esc(v.title)}</span><span class="mt">${gbars(v.gravity)}<span>${esc(fieldName(v.fieldId))}</span><span>${burned}/${v.burnMin} min</span>${w ? `<span class="${w.cls}">${esc(w.txt)}</span>` : ''}${lift && !landed ? worthHTML(v, bm) : ''}</span></button>
    ${landed ? '<span class="dim mono" style="font-size:9.5px;letter-spacing:.12em">LANDED</span>' : `<button class="ignite${live ? ' live' : ''}" data-action="${live ? 'burn-open' : 'ignite'}" data-id="${v.id}" aria-label="${live ? 'Open burn' : 'Ignite'}: ${esc(v.title)}">${live ? I.pause : I.play}<span>${live ? 'Burning' : 'Ignite'}</span></button>`}

}

function todayTimeline(t, bm, lift) {
  const G = groups(), nh = nowHours(), rows = [];
  evOn(t).forEach(e => rows.push({ k: e.time ? hm(e.time) : -2, html: `<div class="tl-row evt"><span class="tm">${e.time || 'All day'}</span><span class="mk"></span><div class="bd"><span class="tt">${esc(e.title)}</span><span class="mt"><span>Event</span></span></div><span></span></div>` }));
  classesOn(t).forEach(c => rows.push({ k: hm(c.s), html: `<div class="tl-row cls${hm(c.e) <= nh ? ' past' : ''}"><span class="tm">${c.s}<br>${c.e}</span><span class="mk"></span><button class="bd" data-mod="timetable"><span class="tt">${esc(c.t)}</span><span class="mt"><span>Class${c.room ? ' · ' + esc(c.room) : ''}</span></span></button><span></span></div>` }));
  travelOn(t).forEach(s => rows.push({ k: s.a, html: `<div class="tl-row trav${s.b <= nh ? ' past' : ''}"><span class="tm">${fmtH(s.a)}<br>${fmtH(s.b)}</span><span class="mk"></span><button class="bd" data-mod="timetable"><span class="tt">${s.label}</span><span class="mt"><span>Travel · not free time</span></span></button><span></span></div>` }));
  G.today.forEach(v => { const late = v.anchor.date < t; rows.push({ k: late ? -1 : v.anchor.time ? hm(v.anchor.time) : 30, html: tlVec(v, bm, late ? 'Carried' : v.anchor.time || 'Any time', late, false, lift) }); });
  state.vectors.filter(v => v.landedAt && dkey(new Date(v.landedAt)) === t).forEach(v => rows.push({ k: v.anchor && v.anchor.date === t && v.anchor.time ? hm(v.anchor.time) : 29, html: tlVec(v, bm, 'Done', false, true) }));
  return rows.length ? rows.sort((a, b) => a.k - b.k).map(r => r.html).join('') : `<div class="empty">Nothing on today. Pull something in from Anytime, or launch a new vector.</div>`;
}

function renderHorizon() { return state.prefs && state.prefs.horizon === 'comb' ? renderComb() : renderBoard(); }

// the Horizon formats: quiet words, a small lit hexagon under the one you are on
function viewSwitch() {
  const mode = state.prefs && state.prefs.horizon === 'comb' ? 'comb' : 'board';
  return `<div class="hview"><div class="hmodes" role="group" aria-label="Horizon format">${[['board', 'Board'], ['comb', 'Comb']].map(([k, l]) => `<button class="${mode === k ? 'sel' : ''}" data-hmode="${k}" aria-pressed="${mode === k}">${l}</button>`).join('')}</div></div>`;
}

// Board: every vector and class as a flight. The day numbers on top; below the board, Today and Anytime.
// Beside it a panel: Next up by default, a vector while you point at its row.
// Click a row to keep it in the panel, click it again to open it.
function renderBoard() {
  const now = new Date(), t = todayKey(), bm = burnMap(), G = groups(), more = !!ui.boardMore;
  if (ui.boardSel && !vec(ui.boardSel)) ui.boardSel = null;
  return `
  <div class="vhead"><div><div class="eyebrow">Horizon</div><h1>${DOW_LONG[now.getDay()]} ${now.getDate()} ${MON_LONG[now.getMonth()]}</h1></div>${viewSwitch()}</div>
  ${horizonBanners()}
  <div class="hz-stats">${dayStats(t, G, bm, dayModel(t), ['burned', 'free', 'classes'])}</div>
  ${sampleBanner()}
  <div class="bz">
    <div class="bz-main">${departures(more)}<button class="b-more" data-action="board-more" aria-expanded="${more}">${more ? 'Less' : 'More'} ${I.down}</button></div>

}
const boardSide = id => {

};

}

// The day numbers (burned today, free left, classes), shared by Comb and Board
function dayStats(t, G, bm, M, keys) {
  const burned = minutesOn(t), planned = burned + remaining(G.today, bm), cl = classesOn(t);
  const cells = {
    burned: `<div><span class="eyebrow">Burned today</span><b>${burned}<small>/ ${planned} MIN</small></b><span class="bar"><i style="width:${planned ? clamp(burned / planned, 0, 1) * 100 : 0}%"></i></span></div>`,
    free: `<div><span class="eyebrow">Free ${M.isToday ? 'left' : ''}</span><b>${fmtFree(M.freeMin)}</b><span class="hs-sub">after classes, travel and plans</span></div>`,

// Next up, Today and Anytime, shared by Comb and Board
// (the Comb leaves Today out, its panel beside the comb already lists today)
function daySections(t, G, bm, withNext = true, withToday = true) {
  const nx = withNext && nextUp(), anyN = G.windows.length + G.floating.length;
  return `<div class="hz2">
    <div class="hz2-main">
      ${nx ? nextCard(nx, bm) : ''}
      ${withToday ? `<section class="sec"><div class="sec-h"><h2>Today</h2><span class="count">${G.today.length + classesOn(t).length}</span><span class="sec-extra"><button class="btn-ghost sm" data-action="add-today">${I.plus} Add to today</button></span></div><div class="tline">${todayTimeline(t, bm)}</div></section>` : ''}
    </div>
    <div class="hz2-side">
      <section class="sec"><div class="sec-h"><h2>Anytime</h2><span class="count">${anyN}</span></div>${anyN ? vlist(G.windows.concat(G.floating), bm) : `<div class="empty">Nothing waiting. Everything has a day.</div>`}</section>
    </div>
  </div>`;
}

/* ============================================================
   EFFICIENCY (the KRS chart): your days as a stock, on a 0–100 scale.
   Everything has a clear exchange rate in points. Gains are multiplied by the
   room left to 100 and losses by your current level, so it never leaves 0–100:
   the higher you are, the harder it is to climb and the more idle time costs.
   It is computed from the burn log each time; nothing extra is stored except
   the plan / pauses / gravity on each session and the moves on a vector.
   ============================================================ */
const MO = {
  start: 50, open: 7 * 60,               // where a new timeline starts; the day "opens" at 07:00
  burn: 5,                               // points per burned hour at Steady gravity (× room left)
  gf: [0, .6, .8, 1, 1.25, 1.5],         // gravity factor: Drift … Critical
  over: 1.5,                             // minutes past the session's minimum count 1.5×
  cls: 1,                                // points per hour in class (× room left): a little, less than working
  idle0: .4, idleUp: .45, idleMax: 3.2,  // points per idle hour (× level), rising with every idle hour in a row:
                                         // hour 1 costs about 0.6, hour 3 about 1.5, from hour 7 on 3.2 (travel counts as idle)
  reach: .3,                             // hitting the minimum (× gravity)
  land: .5,                              // landing: (0.5 + hours of its minimum) × gravity
  quit: 1.5, pause: .1,                  // ending before the minimum: lose the unfinished share + this × gravity × share missed; each pause
  move: .6, carry: .3, lapse: 1,         // postponing (+50% each repeat), each night carried over, a window closing (× gravity)
  earn: 1.5,                             // Debrief: (score − 60) / 40 × this, at the close
  tex: .05                               // size of the small ticks, as a share of the visible range (drawing only)
};
const MO_MAX_DAYS = 3660; // up to ten years of history
const MO_KIND = { land: 'Landed', move: 'Postponed', dip: 'Cut short', carry: 'Carried over', lapse: 'Window closed', earn: 'Debrief' };
const moUp = (S, g) => S + g * (100 - S) / 100;       // a gain of g points, times the room left
const moDown = (S, l) => S - l * S / 100;             // a loss of l points, times your level
const moApply = (S, p) => p >= 0 ? moUp(S, p) : moDown(S, -p);
const fmtIx = v => `${clamp(v, 0, 100).toFixed(2)}%`;
const fmtPts = (p, dp = 2) => `${p >= 0 ? '+' : '−'}${Math.abs(p).toFixed(dp)}`;
const fmtChg = d => `${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(2)} pts`;
const updn = x => x >= 0 ? 'up' : 'down';
const moGf = g => MO.gf[clamp(Math.round(+g) || 3, 1, 5)];
const nth = n => n + (n % 10 === 1 && n % 100 !== 11 ? 'st' : n % 10 === 2 && n % 100 !== 12 ? 'nd' : n % 10 === 3 && n % 100 !== 13 ? 'rd' : 'th');
// Texture: small deterministic up/down ticks so the line reads like a real ticker.
const moHash = i => { let x = Math.imul(i ^ 0x9E3779B9, 0x85EBCA6B); x ^= x >>> 13; x = Math.imul(x, 0xC2B2AE35); x ^= x >>> 16; return (x >>> 0) / 2147483648 - 1; };

const moNoise = am => MO_OCT.reduce((n, [s, w, salt]) => { const q = am / s, i = Math.floor(q), f = q - i; return n + w * (moHash(i * 131 + salt * 7919) * (1 - f) + moHash((i + 1) * 131 + salt * 7919) * f); }, 0);
// what a vector is worth right now: burning the rest of its minimum, reaching it, landing it
function worthOf(v, bm, S) {
  if (S == null) S = moModel().now;
  const rem = Math.max(5, v.burnMin - ((bm || burnMap())[v.id] || 0)), gf = moGf(v.gravity);
  let x = 100 - (100 - S) * Math.exp(-MO.burn / 60 * gf * rem / 100);
  x = moUp(x, MO.reach * gf); x = moUp(x, (MO.land + v.burnMin / 60) * gf);
  return x - S;
}
const worthHTML = (v, bm) => `<span class="lift" title="What this vector adds to your Efficiency if you burn its minimum and land it">+${worthOf(v, bm).toFixed(2)}</span>`;

let moMemo = null;
function moModel() {
  const nowTs = Date.now(), a = state.active;
  const key = `${state.updatedAt}|${Math.floor(nowTs / 60000)}|${state.sessions.length}|${a ? a.id + a.paused : ''}`;
  if (moMemo && moMemo.key === key && moMemo.st === state) return moMemo.M;
  const t = todayKey(), nd = new Date(nowTs), nowMin = nd.getHours() * 60 + nd.getMinutes();

  // the timeline starts with your first vector, burn or debrief (max 180 days back)
  let first = t;
  const see = k => { if (k && k < first) first = k; };
  state.sessions.forEach(s => see(s.day));
  state.vectors.forEach(v => see(dkey(new Date(v.createdAt || nowTs))));
  Object.keys(state.debriefs).forEach(see);
  const lim = addDays(t, -MO_MAX_DAYS); if (first < lim) first = lim;
  const keys = []; for (let k = first; k <= t; k = addDays(k, 1)) keys.push(k);
  const D = new Map(keys.map(k => [k, { k, t0: k2d(k).getTime(), bw: null, bs: null, ev: [], notes: [] }]));
  const dayAt = ts => { const dd = D.get(dkey(new Date(ts))); return dd ? [dd, clamp(Math.floor((ts - dd.t0) / 60000), 0, 1439)] : null; };
  const meta = {};
  const ev = (ts, pts, key, kind, quit) => { const p = dayAt(ts); if (!p) return; p[0].ev.push({ m: p[1], pts, key, kind, quit }); if (kind && kind !== 'carry' && kind !== 'dip') p[0].notes.push({ m: p[1], e: p[1], kind, t: (meta[key] || {}).t || '', s: (meta[key] || {}).s || '', pts }); };
  // notes = what happened when, so the chart can show it (sessions + steps)
  const note = (ts, min, kind, t, extra) => { const p = dayAt(ts); if (p) p[0].notes.push(Object.assign({ m: p[1], e: p[1] + min, kind, t, min }, extra)); };

    let p = dayAt(start); if (!p) return;
    let [dd, m] = p;
    for (let j = 0; j < min; j++, m++) {
      if (m > 1439) { dd = D.get(addDays(dd.k, 1)); m = 0; if (!dd) return; }
      if (!dd.bw) { dd.bw = new Float32Array(1440); dd.bs = new Array(1440); }
      dd.bw[m] = gf * (plan && j >= plan ? MO.over : 1) * Math.min(1, min - j); dd.bs[m] = key;
    }
  };
  state.sessions.forEach(s => {
    if (!s.start || !(s.min > 0)) return;
    const v = vec(s.vectorId), g = clamp(+s.g || (v && v.gravity) || 3, 1, 5), gf = MO.gf[g];
    const key = 's:' + (s.id || s.start), plan = +s.plan || 0, end = s.start + s.min * 60000;
    const landedHere = v && v.landedAt && Math.abs(v.landedAt - end) < 180000;
    const short = plan && s.min < plan && !landedHere, over = plan ? Math.max(0, s.min - plan) : 0;
    meta[key] = { t: (v || s).title || 'Burn', s: `${fmtMin(s.min)} · ${GRAVITY[g][0]}${over ? ` · ${fmtMin(over)} past the minimum` : ''}${short ? ` · ended at ${s.min} of ${plan}` : ''}${s.pauses ? ` · paused ${s.pauses}×` : ''}` };
    addBurn(s.start, s.min, plan, gf, key);
    note(s.start, s.min, short ? 'quit' : 'burn', meta[key].t, { plan });
    if (plan && s.min >= plan) ev(s.start + plan * 60000, MO.reach * gf, key);
    if (short || s.pauses) ev(end, -((short ? MO.quit * gf * (1 - s.min / plan) : 0) + MO.pause * (s.pauses || 0)), key, 'dip', short ? 1 - s.min / plan : 0);
  });
  if (a && vec(a.vectorId)) {
    const v = vec(a.vectorId), el = elapsedMs(a) / 60000, end = a.paused && a.pausedAt ? a.pausedAt : nowTs, plan = (a.planMs || a.targetMs) / 60000, gf = moGf(v.gravity);
    meta['s:live'] = { t: v.title, s: `${a.paused ? 'Paused' : 'Burning now'} · ${fmtMin(el)}${el > plan ? ` · ${fmtMin(el - plan)} past the minimum` : ''}`, live: true };
    addBurn(end - el * 60000, el, plan, gf, 's:live');

  }

  state.vectors.forEach(v => {
    const gf = moGf(v.gravity);
    if (v.landedAt) { meta['l:' + v.id] = { t: v.title, s: `Landed · ${GRAVITY[v.gravity][0]}` }; ev(v.landedAt, (MO.land + v.burnMin / 60) * gf, 'l:' + v.id, 'land'); }
    (v.moves || []).forEach((mv, i) => {
      const k = `m:${v.id}:${i}`;
      meta[k] = { t: v.title, s: `${mv.k === 'w' ? 'Deadline pushed' : 'Postponed'}${mv.to ? ' to ' + dayLabel(mv.to).toLowerCase() : ''}${i ? ` · ${nth(i + 1)} time` : ''}` };

  // closes: anything still carried over, windows that closed unlanded
  const whenAt = (v, T, k) => { const mv = (v.moves || []).filter(x => x.k === k).sort((x, y) => x.at - y.at).find(x => x.at > T); return mv ? mv.from : k === 'a' ? (v.anchor && v.anchor.date) : (v.window && v.window.until); };
  const cand = state.vectors.filter(v => v.anchor || v.window || (v.moves && v.moves.length));
  keys.forEach(k => {
    if (k >= t) return;
    const T = D.get(k).t0 + 864e5 - 30000;
    cand.forEach(v => {
      if ((v.createdAt || 0) > T || (v.landedAt && v.landedAt <= T)) return;
      const gf = moGf(v.gravity), ad = whenAt(v, T, 'a'), wd = whenAt(v, T, 'w');
      if (ad && ad <= k) { meta['c:' + v.id] = { t: v.title, s: `Carried over · anchored ${dayLabel(ad).toLowerCase()}` }; ev(T, -MO.carry * gf, 'c:' + v.id, 'carry'); }
      if (wd && wd === k) { meta['w:' + v.id] = { t: v.title, s: 'Window closed before it landed' }; ev(T, -MO.lapse * gf, 'w:' + v.id, 'lapse'); }

const AT_RATE = [[3, 'Good'], [2, 'Okay'], [1, 'Bad']];

// ---------- departure board: today's vectors as flights, then the next days ----------
// Letters flip only where they changed since the last time the board was drawn.
// No time set: the time tiles show a small lit hexagon instead (any time today).
const BOARD_ST = { landed: ['LANDED', 'up'], flight: ['IN FLIGHT', 'if'], delayed: ['DELAYED', 'dl'], boarding: ['BOARDING', 'bd'], scheduled: ['SCHEDULED', 'sc'], standby: ['STANDBY', 'sc'] };
const boardSeen = {};
function departures(more = false) {
  const t = todayKey(), live = state.active && state.active.vectorId;
  const stOf = v => v.landedAt ? 'landed' : v.id === live ? 'flight' : v.anchor ? (v.anchor.date < t ? 'delayed' : v.anchor.date === t ? 'boarding' : 'scheduled') : 'standby';
  const timeOf = v => (v.anchor && v.anchor.time) || (v.landedAt ? hhmm(v.landedAt) : '');
  const byTime = (a, b) => cmp(timeOf(a) || '99', timeOf(b) || '99') || b.gravity - a.gravity;
  const flap = (s, n, key) => {
    const was = boardSeen[key] || '', str = s.toUpperCase().padEnd(n).slice(0, n); boardSeen[key] = str;
    return str.split('').map((c, i) => `<i${c !== was[i] ? ` class="flip" style="--d:${i * 22}ms"` : ''}>${c === ' ' ? '&nbsp;' : esc(c)}</i>`).join('');
  };
  // the vector you are burning: lit row, blue letters, a live countdown instead of the minutes and a bar that fills
  const row = v => {
    let [lab, cls] = BOARD_ST[stOf(v)];
    if (!v.anchor && !v.landedAt && v.id !== live && v.window) { const w = windowInfo(v); lab = w.cls === 'late' ? 'CLOSING' : 'BY ' + DOW[k2d(v.window.until).getDay()]; cls = w.cls === 'late' ? 'dl' : 'sc'; }
    const isLive = v.id === live; if (isLive && state.active.paused) { lab = 'HOLDING'; cls = 'hd'; }
    const moved = boardSeen[v.id + 's'] !== lab, tm = timeOf(v); boardSeen[v.id + 's'] = lab;
    return `<button class="b-row${v.landedAt ? ' done' : ''}${isLive ? ' live' : ''}${ui.boardSel === v.id ? ' on' : ''}" data-bsel="${v.id}"><span class="flaps time${tm ? '' : ' any'}"${tm ? '' : ' title="Any time"'}>${flap(tm, 5, v.id + 't')}</span><span class="flaps nm">${flap(v.title, 30, v.id + 'n')}</span><span class="b-burn"${isLive ? ' data-bclock' : ''}>${v.burnMin}M</span><span class="b-st ${cls}${moved ? ' flip' : ''}">${lab}</span>${isLive ? '<span class="b-prog" aria-hidden="true"><i data-bprog></i></span>' : ''}</button>`;
  };
  // classes ride along as their own rows: hatched tiles, CLASS / IN CLASS / ENDED
  const nh = nowHours();
  const clsRow = (c, d) => {
    const st = d !== t ? 'CLASS' : hm(c.e) <= nh ? 'ENDED' : hm(c.s) <= nh ? 'IN CLASS' : 'CLASS', key = 'c' + c.id + d;
    return `<button class="b-row cls${st === 'ENDED' ? ' done' : ''}" data-mod="timetable"><span class="flaps time">${flap(c.s, 5, key + 't')}</span><span class="flaps nm">${flap(c.short || c.t, 30, key + 'n')}</span><span class="b-burn">${Math.round((hm(c.e) - hm(c.s)) * 60)}M</span><span class="b-st ${st === 'IN CLASS' ? 'ic' : st === 'ENDED' ? 'sc' : 'cl'}">${st}</span></button>`;
  };
  const kOf = v => { const tm = timeOf(v); return tm ? hm(tm) : 30; };
  const evRow = (e, d) => `<div class="b-row evt"><span class="flaps time${e.time ? '' : ' any'}">${flap(e.time || '', 5, 'e' + e.id + 't')}</span><span class="flaps nm">${flap(e.title, 30, 'e' + e.id + 'n')}</span><span class="b-burn"></span><span class="b-st ev">EVENT</span></div>`;

  return `<div class="board"><div class="b-head"><span>TIME</span><span>VECTOR</span><span class="r bb">BURN</span><span class="r">STATUS</span></div>${today.length ? today.join('') : `<div class="b-free">NOTHING TODAY</div>`}${ahead}</div>`;
}

function renderTelemetry() {
  const t = todayKey();
  const days14 = [...Array(14)].map((_, i) => addDays(t, i - 13));
  const vals = days14.map(minutesOn);
  const daySet = new Set(state.sessions.map(s => s.day));
  let streak = 0, k = daySet.has(t) ? t : addDays(t, -1);
  while (daySet.has(k)) { streak++; k = addDays(k, -1); }
  const rawMax = Math.max(...vals, 1);
  const step = [15, 30, 60, 90, 120].find(s => rawMax / s <= 4) || 180;
  const ymax = Math.ceil(rawMax / step) * step;
  const ticks = []; for (let v = 0; v <= ymax; v += step) ticks.push(v);
  const from = addDays(t, -6), byField = {};
  state.sessions.filter(s => s.day >= from).forEach(s => { const f = s.fieldId || (vec(s.vectorId) || {}).fieldId || ''; byField[f] = (byField[f] || 0) + s.min; });
  const fieldRows = Object.entries(byField).sort((a, b) => b[1] - a[1]);
  const fmax = Math.max(1, ...fieldRows.map(r => r[1]));
  const log = [...state.sessions].sort((a, b) => b.start - a.start).slice(0, 6);

  return `
  <div class="vhead"><div><div class="eyebrow">Telemetry</div><h1>Where your time went</h1></div></div>
  ${teleOverview(streak)}
  ${section('Burn log', state.sessions.length, log.length ? `<div class="tbl-wrap"><table class="log"><tbody>${log.map(s => `<tr><td class="mono">${dayLabel(s.day).toUpperCase()}<br>${hhmm(s.start)}</td><td class="lt">${esc((vec(s.vectorId) || {}).title || s.title)}<span class="lf">${esc(fieldName(s.fieldId))}</span></td><td class="mono r">${s.min} MIN</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">No burns yet. Ignite a vector and it shows up here.</div>`)}
  ${section('By field', '7 days', fieldRows.length ? `<div class="hbars">${fieldRows.map(([f, m]) => `<div class="hb" data-tip="${esc(fieldName(f))} · ${fmtMin(m)}"><span class="hn">${esc(fieldName(f))}</span><span class="ht"><b style="width:${m / fmax * 100}%"></b></span><span class="hv">${fmtMin(m).toUpperCase()}</span></div>`).join('')}</div>` : `<div class="empty">Nothing burned in the last 7 days.</div>`)}
  <section class="mo-hero tele">${moBlock('t', ui.moRange.t, mapWidth(), moModel())}</section>
      ${section('Burn per day', '14 days', `
      <div class="chart" role="img" aria-label="Minutes burned per day over the last 14 days">
        <div class="chart-y">${ticks.map(v => `<span style="bottom:${v / ymax * 100}%">${v}</span>`).join('')}</div>
        <div class="chart-plot">
          ${ticks.slice(1).map(v => `<i class="gl" style="bottom:${v / ymax * 100}%"></i>`).join('')}
          <div class="chart-bars">${days14.map((d, i) => `<div class="chart-col${d === t ? ' today' : ''}" data-tip="${esc(dayLabel(d))} · ${vals[i]} min">${vals[i] ? `<b style="height:${vals[i] / ymax * 100}%"></b>` : ''}</div>`).join('')}</div>
        </div>
        <div class="chart-x">${days14.map(d => `<span class="${d === t ? 'today' : ''}">${k2d(d).getDate()}</span>`).join('')}</div>
      </div>`)}`;
}

// Overview at the top of Telemetry: how much you burned, what on, and how that compares.
// One stacked line shows the split by field; below it every vector you worked on, longest first.
const TELE_R = { d: [1, 'Today', 'yesterday'], w: [7, '7 days', 'the 7 days before'], m: [30, '30 days', 'the 30 days before'] };
function teleOverview(streak) {
  const t = todayKey(), r = ui.teleRange || 'w', [len, lab, prevLab] = TELE_R[r];
  const from = addDays(t, 1 - len), pFrom = addDays(from, -len);
  const ss = state.sessions.filter(s => s.day >= from && s.day <= t);
  const total = ss.reduce((a, s) => a + s.min, 0), prev = state.sessions.filter(s => s.day >= pFrom && s.day < from).reduce((a, s) => a + s.min, 0), d = total - prev;
  const landed = state.vectors.filter(v => v.landedAt && dkey(new Date(v.landedAt)) >= from).length;
  const fOf = s => s.fieldId || (vec(s.vectorId) || {}).fieldId || '';

    const k = s.vectorId || 't:' + s.title, o = byV[k] || (byV[k] = { v: vec(s.vectorId), t: (vec(s.vectorId) || s).title || 'Burn', f: fOf(s), min: 0, n: 0 });

  const row = x => `<${x.v ? `button data-open-vector="${x.v.id}"` : 'div'} class="tv-row"><i class="hx${x.v && x.v.landedAt ? ' l' : ''}" style="--o:${shade(fi[x.f])}"></i><span class="tv-t"><b>${esc(x.t)}</b><em>${esc(fieldName(x.f))} · ${x.n} ${x.n === 1 ? 'burn' : 'burns'}</em></span><span class="tv-bar"><i style="width:${(x.min / vmax * 100).toFixed(1)}%;--o:${shade(fi[x.f])}"></i></span><span class="tv-m">${fmtFree(x.min)}</span></${x.v ? 'button' : 'div'}>`;
  return `<section class="tov">
    <div class="tov-h">
      <div class="tov-big"><span class="eyebrow">Burned · ${lab}</span><b>${total ? fmtFree(total) : '0m'}</b><em class="${d >= 0 ? 'up' : 'down'}">${d >= 0 ? '▲' : '▼'} ${fmtFree(Math.abs(d))} vs ${prevLab}</em></div>
      <div class="tov-mini">
        <div><b>${landed}</b><span>Landed</span></div>
        <div><b>${len > 1 ? fmtFree(total / len) : ss.length}</b><span>${len > 1 ? 'Per day' : 'Burns'}</span></div>
        <div><b>${streak}</b><span>Day streak</span></div>
      </div>
      <div class="hmodes tov-rng" role="group" aria-label="Range">${Object.entries(TELE_R).map(([k, [, l]]) => `<button class="${r === k ? 'sel' : ''}" data-tele-range="${k}" aria-pressed="${r === k}">${l}</button>`).join('')}</div>
    </div>
    ${total ? `<div class="tov-split">${fr.map(([f, m], i) => `<i style="flex:${m};--o:${shade(i)}" data-tip="${esc(fieldName(f))} · ${fmtMin(m)}"></i>`).join('')}</div>
    <div class="tov-leg">${fr.map(([f, m], i) => `<span><i style="--o:${shade(i)}"></i>${esc(fieldName(f))}<b>${fmtFree(m)}</b></span>`).join('')}</div>
    <div class="tv-list">${vr.slice(0, 8).map(row).join('')}</div>
    ${vr.length > 8 ? `<div class="tv-more">+ ${vr.length - 8} more · ${fmtFree(vr.slice(8).reduce((a, x) => a + x.min, 0))}</div>` : ''}` : `<div class="empty">Nothing burned ${r === 'd' ? 'today' : 'in the last ' + lab} yet.</div>`}

function paintTrack(el, minutes, elapsedMin) {

function ledTipText(kind, m) {

  if (kind === 'live' && state.active) { const left = m - elapsedMs(state.active) / 60000; return [fmtMin(m), `ends ${hhmm(Date.now() + Math.max(0, left) * 60000)}`]; }

  const tip = tr.querySelector('.led-tip'); if (!tip) return;

function ledClear(tr) {

let drag = null;
document.addEventListener('pointerdown', e => {

/* ============================================================

const flowEl = $('#flow');
const STEPS = ['Field', 'Intent', 'Burn', 'Gravity', 'Anchor'];

function openFlow(preset = {}) {
  ui.draft = Object.assign({ fieldId: null, title: '', note: '', showNote: false, stages: [], stageDraft: '', burnMin: 25, gravity: 3, when: 'float', anchorDate: null, anchorTime: '', windowUntil: null }, preset);

}
function closeFlow() { ui.flowOpen = false; flowEl.hidden = true; unlock(); }
function flushStageDraft() { const d = ui.draft; if (d && d.stageDraft && d.stageDraft.trim()) { d.stages.push(d.stageDraft.trim()); d.stageDraft = ''; } }
function goStep(n) { flushStageDraft(); ui.step = clamp(n, 0, 4); renderFlow(); }

const stepHead = (n, title, hint) => `<div class="step-head"><div class="eyebrow">${pad(n + 1)} · ${STEPS[n].toUpperCase()}</div><h2>${title}</h2>${hint ? `<p>${hint}</p>` : ''}</div>`;

/* ============================================================
   TIMETABLE helpers (uni classes repeat every week)
   ============================================================ */
const hm = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return h + (m || 0) / 60; };
const dowOf = k => (k2d(k).getDay() || 7); // 1 = Monday … 7 = Sunday
const DOW_NAME = ['', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];

  const seg = (s, cls) => { const w = (clamp(s.b, 7, 24) - clamp(s.a, 7, 24)) / 17 * 100; return w > .2 ? `<i class="${cls}" style="left:${P(s.a)}%;width:${w.toFixed(2)}%" data-tip="${esc(s.tip)}"></i>` : ''; };

    const any = open.filter(v => v.anchor && !v.anchor.time && (v.anchor.date === d || (d === t && v.anchor.date < t))).sort(byGravity);
    const dd = k2d(d), isT = d === t, past = d < t;

      <span class="wg-any"${any.length ? ` data-tip="${esc('Any time: ' + any.map(v => `${v.title} (${fmtMin(Math.max(5, v.burnMin - (bm[v.id] || 0)))})`).join(', '))}"` : ''}>${any.slice(0, 3).map(v => `<i class="g${v.gravity}"></i>`).join('')}${any.length > 3 ? `<em>+${any.length - 3}</em>` : ''}</span>

}

// The sky: every drop is a star you can come back to when you have time.
// Stars grow a little brighter the longer they wait; new ones twinkle warm until you look at them.
// Open drops are joined in the order you dropped them, like a constellation. Done ones fade to grey.
const SKY_DUST = (() => { let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647; return [...Array(46)].map(() => [r() * 100, r() * 100, .12 + r() * .22, .15 + r() * .45]); })();

  // label sizes in % of the sky, from its real width (the sheet is full width on a phone, and the sky is square there)
  const narrow = window.innerWidth < 560, W = Math.max(260, Math.min(window.innerWidth, 480) - 42), H = W * (narrow ? 1 : .8), CPL = narrow ? 20 : 26;
  // start on a sunflower spiral around the middle, then nudge the labels apart until none of them touch
  const pos = nodes.map((d, i) => {
    const a = i * 2.39996 + .8, r = N === 1 ? 0 : 10 + 32 * Math.sqrt((i + .5) / N);
    const chars = d.text.length, lines = Math.min(2, Math.ceil(chars / CPL));
    const w = Math.min(52, (Math.min(chars, CPL) * 6.4 + 32) / W * 100), h = (lines * 16.4 + 18) / H * 100;
    const sx = 50 + r * Math.cos(a) * 1.05 - w / 3, sy = 50 + r * Math.sin(a) * .9;

    <div class="ds-n"><b>${nOpen}</b>open${nDone ? ` · ${nDone} done` : ''}</div>
    ${pos.map(p => { const age = (now - p.d.at) / 864e5; return `<button role="listitem" class="star${st(p.d)}" style="left:${(p.x - p.w / 2).toFixed(1)}%;top:${(p.y - p.h / 2).toFixed(1)}%;max-width:${Math.min(54, p.w + 2).toFixed(1)}%;--s:${(.8 + Math.min(.6, age * .09)).toFixed(2)}" data-drop-sel="${p.d.id}"><i class="sp"></i><span class="st">${esc(p.d.text)}</span><em>${agoTxt(p.d.at)}</em></button>`; }).join('')}
  </div>
  ${more.length ? `<div class="drops">${more.map(d => `<button class="drop dm-row${d.done ? ' done' : ''}${d.id === sel ? ' sel' : ''}" data-drop-sel="${d.id}"><span class="dt">${esc(d.text)}</span><span class="da mono">${agoTxt(d.at)}</span></button>`).join('')}</div>` : ''}`;
}

const burnEl = $('#burn'), pillEl = $('#pill');
const elapsedMs = a => a.accMs + (a.paused ? 0 : Math.max(0, Date.now() - a.startedAt));
const BURN_HEX = hexPts(100, 87, 95);

function ignite(id) {
  const v = vec(id); if (!v) return;
  primeAudio();
  if (state.active && state.active.vectorId !== id) logActive(false);
  if (!state.active) { const ms = defaultSession(v) * 60000; state.active = { id: uid(), vectorId: id, startedAt: Date.now(), accMs: 0, targetMs: ms, planMs: ms, pauses: 0, paused: false }; }

}
function openBurn() { if (!state.active) return; ui.burnOpen = true; burnEl.hidden = false; lock(); renderBurn(); }

// End the active burn and write it to the log. Returns minutes logged.
function logActive(land) {
  const a = state.active; if (!a) return 0;
  const v = vec(a.vectorId);
  const ms = elapsedMs(a), min = Math.round(ms / 60000), end = a.paused && a.pausedAt ? a.pausedAt : Date.now();
  if (min >= 1 && v) state.sessions.push({ id: uid(), vectorId: v.id, fieldId: v.fieldId, title: v.title, start: end - ms, min, plan: Math.round((a.planMs || a.targetMs) / 60000), pauses: a.pauses || 0, g: v.gravity, day: dkey(new Date(end - ms)) });
  if (land && v) v.landedAt = Date.now();
  if (v && v.atQuick && !v.landedAt) { if (min >= 1) v.landedAt = Date.now(); else state.vectors = state.vectors.filter(x => x !== v); }
  state.active = null; wakeOff();
  return min;
}

function renderBurn() {

  const v = vec(a.vectorId); if (!v) { state.active = null; commit(); return; }

function renderPill() {
  const a = state.active;
  if (!a || ui.burnOpen) { pillEl.hidden = true; return; }

function tick() {
  const a = state.active; if (!a) return;
  const target = ui.liveTarget ? ui.liveTarget * 60000 : a.targetMs;
  const el = elapsedMs(a), rem = target - el, over = rem <= 0;
  const clock = over ? '+' + fmtClock(Math.floor(-rem / 1000) * 1000) : fmtClock(Math.ceil(rem / 1000) * 1000);
  const key = a.id + ':' + a.targetMs;
  if (over && !a.paused && !ui.liveTarget && ui.chimed !== key) { ui.chimed = key; if (rem > -3000) chime(); if (rem > -120000) notifyEnd(a); }
  if (ui.burnOpen) {
    const c = $('#bclock'); if (c) { c.textContent = clock; c.classList.toggle('long', clock.length > 6); }
    const s = $('#bsub'); if (s) s.textContent = over ? `Minimum reached · overtime` : `left of ${fmtMin(target / 60000)}`;
    const st = $('#bstate'); if (st) st.textContent = a.paused ? 'PAUSED' : over ? 'OVERTIME' : 'BURNING';
    const p = $('#bprog'); if (p) p.setAttribute('stroke-dasharray', `${Math.min(100, el / target * 100).toFixed(2)} 100`);
    burnEl.classList.toggle('over', over); burnEl.classList.toggle('paused', !!a.paused);
    const tr = burnEl.querySelector('.track'); if (tr && !ui.dragging) paintTrack(tr, Math.round(target / 60000), el / 60000);
    const bmo = $('#bmo'), mk = Math.floor(Date.now() / 60000) + ':' + a.paused;
    if (bmo && (bmo.dataset.k !== mk || !bmo.textContent)) { const M = moModel(), T = M.today, ch = M.now - T.open; bmo.dataset.k = mk; bmo.className = 'burn-mo ' + updn(ch); bmo.innerHTML = `<span class="mo-tk">KRS</span><b>${fmtIx(M.now)}</b><span>${fmtChg(ch)}</span><span class="w">today</span>`; }
  }
  const p = $('#pclock');
  if (p) { p.textContent = (a.paused ? 'PAUSED · ' : '') + clock; pillEl.classList.toggle('paused', !!a.paused); }
  $$('[data-olive]').forEach(o => { o.textContent = a.paused ? 'PAUSED ' + clock : over ? clock : clock + ' left'; });
  $$('[data-bclock]').forEach(o => { o.textContent = clock; });
  $$('[data-bprog]').forEach(o => { o.style.width = Math.min(100, el / target * 100).toFixed(1) + '%'; });
}
setInterval(tick, 250);

// a system notification when the minimum is reached while KAIROS is in the background
// (the installed app on the laptop; a phone pauses web apps in the background, so there it chimes when you come back)
function notifyEnd(a) {
  try {
    if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return;
    const v = vec(a.vectorId), opts = { body: v ? `${v.title} · minimum reached` : 'Minimum reached', icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: 'kairos-burn' };
    if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification('KAIROS', opts)).catch(() => {});

// sound + screen wake
let actx = null, wake = null;
function primeAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function chime() {
  try { navigator.vibrate && navigator.vibrate([120, 80, 120]); } catch (e) {}
  if (!actx) return;
  try {
    const t0 = actx.currentTime;
    [[660, 0], [880, .16], [1320, .32]].forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.16, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.7);
      o.connect(g); g.connect(actx.destination); o.start(t0 + d); o.stop(t0 + d + 0.75);
    });

}
